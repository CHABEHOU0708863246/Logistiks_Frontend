<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <title>LOGISTIK | Gestion de Flotte</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="LOGISTIK — application de gestion de flotte et de location de véhicules.">
  <meta name="theme-color" content="#696CFF">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LOGISTIK">
  <meta name="format-detection" content="telephone=no">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">

  <!-- Écran de démarrage statique : il peint avant le chargement d'Angular
       (LCP/FCP mobile) et disparaît dès que l'application est montée. -->
  <style>
    .iam-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 24px;
      background: linear-gradient(135deg, #0e0a2e 0%, #1a0e5c 45%, #090720 100%);
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-align: center;
      transition: opacity 0.25s ease;
    }

    .iam-splash.is-ready {
      opacity: 0;
      pointer-events: none;
    }

    .iam-splash__mark {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 84px;
      height: 84px;
      margin-bottom: 14px;
      border: 1px solid rgba(139, 142, 255, 0.45);
      border-radius: 22px;
      background: linear-gradient(135deg, #696cff 0%, #3c3489 100%);
      box-shadow: 0 18px 44px rgba(105, 108, 255, 0.35);
      font-size: 42px;
    }

    .iam-splash__title {
      margin: 0;
      font-size: clamp(2.6rem, 13vw, 4rem);
      font-weight: 800;
      letter-spacing: 0.18em;
      line-height: 1.05;
      background: linear-gradient(135deg, #ffffff 0%, #8b8eff 60%, #ffd166 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .iam-splash__subtitle {
      margin: 0;
      color: rgba(255, 255, 255, 0.62);
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .iam-splash__bar {
      width: 140px;
      height: 4px;
      margin-top: 22px;
      overflow: hidden;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.14);
    }

    .iam-splash__bar span {
      display: block;
      width: 45%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #8b8eff, #ffd166);
      animation: iam-splash-slide 1.1s ease-in-out infinite alternate;
    }

    @keyframes iam-splash-slide {
      from { transform: translateX(-20%); }
      to { transform: translateX(160%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .iam-splash__bar span { animation: none; width: 100%; }
    }
  </style>
</head>

<body>
  <app-root></app-root>
  <div id="iam-splash" class="iam-splash" role="status" aria-live="polite" aria-label="Chargement de LOGISTIK">
      <div class="iam-splash__mark" aria-hidden="true">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 6.5h10v9H3z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M13 9.5h4.2l2.8 3.1v2.9H13z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
          <circle cx="7" cy="17.5" r="1.7" stroke="#fff" stroke-width="1.6"/>
          <circle cx="17" cy="17.5" r="1.7" stroke="#fff" stroke-width="1.6"/>
        </svg>
      </div>
      <h1 class="iam-splash__title">LOGISTIK</h1>
      <p class="iam-splash__subtitle">Gestion de flotte</p>
      <div class="iam-splash__bar" aria-hidden="true"><span></span></div>
  </div>
  <noscript>Activez JavaScript pour utiliser LOGISTIK.</noscript>
</body>

</html>
